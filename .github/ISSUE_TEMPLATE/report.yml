name: Report Malicious Domain
description: Submit a new phishing link, crypto drainer, or token grabber for verification.
title: "[Report]: "
labels: ["needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Enter up to 20 domains or URLs, one per line. Keep the same threat category for the whole batch. Every entry is checked before the batch is sent for review.
  - type: textarea
    id: domain
    attributes:
      label: Malicious Domains or URLs
      description: One domain or URL per line. Up to 20 unique entries. Do not include comments or separators.
      placeholder: |
        scam-discord-nitro.xyz
        https://wallet-drainer.click/claim
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Threat Category
      options:
        - Crypto Drainer / Fake Airdrop
        - Discord Nitro / Token Grabber
        - Steam Trade / Skin Fraud
        - Casino / Gambling Fraud
        - General Phishing / Malware
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context or Proof (Optional)
      description: Where was this link encountered? (e.g. unsolicited Discord DM, fake bot invite).
      placeholder: Sent via Discord DM claiming to offer free Nitro rewards.
    validations:
      required: false
