name: Close Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write

    steps:
      - name: Close and direct to report form
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: 'Pull requests are closed on this repository to maintain dataset integrity and prevent poisoning. Please submit new phishing links via the [Domain Report form](https://github.com/fisventurous/fisphish/issues/new?template=report.yml).'
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });
