name: Sync Threat Feeds

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: '0 0,12 * * *'
  workflow_dispatch:

concurrency:
  group: sync-threat-feeds
  cancel-in-progress: true

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run threat intelligence aggregator
        run: npx --yes tsx src/build.ts

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): sync threat intelligence feeds [skip ci]"
            git push
          else
            echo "No feed changes detected. Everything up to date."
          fi
